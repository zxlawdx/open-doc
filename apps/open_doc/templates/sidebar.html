<!-- ============ DOCUMENT NAVIGATOR ============ -->
<aside class="navigator" aria-label="Navegador do documento">
  <div class="navigator-header"><span data-nav-label>NAVEGADOR</span>
    <button class="icon-button" data-toggle aria-label="Alternar navegador" aria-expanded="true" title="Alternar navegador">
      <svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#sidebar"></use></svg>
    </button>
  </div>
  <button class="navigator-document" data-action="home" title="Documentos recentes">
    <svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#folder"></use></svg>
    <span data-nav-label>Documentos recentes</span>
  </button>
  <div class="navigator-content" data-nav-label>
    <label class="find-label" for="find-input">LOCALIZAR NO DOCUMENTO</label>
    <div class="find-field"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#search"></use></svg>
      <input id="find-input" data-find placeholder="Buscar texto…" autocomplete="off">
    </div>
    <div class="find-replace-controls"><label>Substituir por <input data-replacement autocomplete="off"></label><div><button data-find-prev>Anterior</button><button data-find-next>Próximo</button></div><div><button data-replace-one>Substituir</button><button data-replace-all>Substituir todos</button></div></div>
    <div class="find-results" data-find-results role="status"></div>
    <p class="outline-label">ESTRUTURA DO DOCUMENTO</p>
    <nav data-outline aria-label="Títulos do documento"></nav>
  </div>
  <span class="navigator-local" data-nav-label>Salvo neste dispositivo</span>
</aside>
