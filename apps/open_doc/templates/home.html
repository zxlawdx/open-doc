<!-- ============ REAL RECENT DOCUMENTS ============ -->
<main class="home" data-library hidden aria-labelledby="recent-title">
  <div class="home-inner">
    <p class="home-product">OPEN DOC</p>
    <h1 id="recent-title">O que vamos escrever hoje?</h1>
    <p class="home-intro">Um espaço para suas ideias. Seus documentos ficam no seu computador.</p>
    <div class="home-actions"><button class="primary-button" data-new>Novo documento</button><button data-import>Abrir / importar</button></div>
    <div class="recent-heading"><h2>Recentes</h2><span>Armazenamento local</span></div>
    <ul data-documents class="document-list" aria-label="Documentos recentes"></ul>
    <div class="recent-heading"><h2>Arquivos importados</h2></div>
    <ul data-files class="document-list" aria-label="Biblioteca local"></ul>
  </div>
</main>
