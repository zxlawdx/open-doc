<!-- ============ FORMATTING TOOLBAR ============ -->
<div class="toolbar" role="toolbar" aria-label="Formatação do documento">
<button class="icon-button" data-command="undo" aria-label="Desfazer (Ctrl+Z)" title="Desfazer (Ctrl+Z)"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#undo"></use></svg></button><button class="icon-button" data-command="redo" aria-label="Refazer (Ctrl+Y)" title="Refazer (Ctrl+Y)"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#redo"></use></svg></button>
<span class="toolbar-divider"></span>
<label class="sr-only" for="paragraph-style">Estilo de parágrafo</label>
<select id="paragraph-style" data-paragraph><option value="paragraph">Texto normal</option><option value="h1">Título 1</option><option value="heading">Título 2</option><option value="h3">Título 3</option></select>
<span class="toolbar-divider"></span>
<button class="icon-button" data-command="bold" aria-label="Negrito (Ctrl+B)" title="Negrito (Ctrl+B)" aria-pressed="false"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#bold"></use></svg></button><button class="icon-button" data-command="italic" aria-label="Itálico (Ctrl+I)" title="Itálico (Ctrl+I)" aria-pressed="false"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#italic"></use></svg></button>
<span class="toolbar-divider"></span>
<button class="icon-button" data-command="list" aria-label="Lista com marcadores" title="Lista com marcadores"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#list"></use></svg></button><button class="icon-button" data-command="ordered" aria-label="Lista numerada" title="Lista numerada"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#ordered"></use></svg></button><button class="icon-button" data-command="quote" aria-label="Citação" title="Citação"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#quote"></use></svg></button><button class="icon-button" data-command="code" aria-label="Bloco de código" title="Bloco de código"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#code"></use></svg></button>
<span class="toolbar-divider"></span>
<button class="icon-button" data-action="link" aria-label="Inserir link" title="Inserir link"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#link"></use></svg></button>
<span class="toolbar-divider"></span>
<select data-font-family data-inline-style="font_family" aria-label="Fonte"><option value="">Fonte</option></select>
<input type="number" min="1" max="512" step="0.5" value="12" data-font-size data-inline-style="font_size_pt" aria-label="Tamanho da fonte (pt)">
<button class="icon-button" data-command="underline" aria-label="Sublinhado"><u>U</u></button>
<button class="icon-button" data-command="strike" aria-label="Tachado"><s>S</s></button>
<button class="icon-button" data-command="superscript" aria-label="Sobrescrito">x²</button>
<button class="icon-button" data-command="subscript" aria-label="Subscrito">x₂</button>
<label title="Cor do texto">A <input type="color" value="#202124" data-inline-style="color" aria-label="Cor do texto"></label>
<label title="Realce">▰ <input type="color" value="#ffff00" data-inline-style="highlight" aria-label="Realce"></label>
<select data-paragraph-style="alignment" aria-label="Alinhamento"><option value="left">Esquerda</option><option value="center">Centro</option><option value="right">Direita</option><option value="justify">Justificado</option></select>
<select data-paragraph-style="line_spacing" aria-label="Entrelinhas"><option value="1">Simples</option><option value="1.15">1,15</option><option value="1.5">1,5</option><option value="2">Duplo</option></select>
<input type="number" min="0" max="720" step="6" value="0" data-paragraph-style="left_indent_pt" aria-label="Recuo esquerdo (pt)" title="Recuo em pontos">
<button class="icon-button" data-action="table-insert" aria-label="Inserir tabela" title="Inserir tabela…">▦</button>
<span class="toolbar-spacer"></span><span class="toolbar-note">Documento local</span>
</div>
