<!-- Formatting groups preserve all command selectors. -->
<div class="toolbar" role="toolbar" aria-label="Formatação do documento">
<div class="toolbar-group" data-toolbar-group="history">
<button class="icon-button" data-command="undo" aria-label="Desfazer (Ctrl+Z)" title="Desfazer (Ctrl+Z)"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#undo"></use></svg></button><button class="icon-button" data-command="redo" aria-label="Refazer (Ctrl+Y)" title="Refazer (Ctrl+Y)"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#redo"></use></svg></button>
</div>
<div class="toolbar-group" data-toolbar-group="paragraph">
<label class="sr-only" for="paragraph-style">Estilo de parágrafo</label><select id="paragraph-style" data-paragraph><option value="paragraph">Texto normal</option>
<option value="h1">Título 1</option>
<option value="heading">Título 2</option>
<option value="h3">Título 3</option></select>
</div>
<div class="toolbar-group" data-toolbar-group="basic-inline">
<button class="icon-button" data-command="bold" aria-label="Negrito (Ctrl+B)" title="Negrito (Ctrl+B)" aria-pressed="false"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#bold"></use></svg></button><button class="icon-button" data-command="italic" aria-label="Itálico (Ctrl+I)" title="Itálico (Ctrl+I)" aria-pressed="false"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#italic"></use></svg></button>
</div>
<div class="toolbar-group" data-toolbar-group="lists">
<button class="icon-button" data-command="list" aria-label="Lista com marcadores" title="Lista com marcadores"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#list"></use></svg></button><button class="icon-button" data-command="ordered" aria-label="Lista numerada" title="Lista numerada"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#ordered"></use></svg></button><button class="icon-button" data-command="quote" aria-label="Citação" title="Citação"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#quote"></use></svg></button><button class="icon-button" data-command="code" aria-label="Bloco de código" title="Bloco de código"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#code"></use></svg></button>
</div>
<div class="toolbar-group" data-toolbar-group="link"><button class="icon-button" data-action="link" aria-label="Inserir link" title="Inserir link"><svg aria-hidden="true"><use href="{{ static('open_doc/icons.svg') }}#link"></use></svg></button></div>
<div class="toolbar-group" data-toolbar-group="font"><select data-font-family data-inline-style="font_family" aria-label="Fonte"><option value="">Fonte</option></select></div>
<div class="toolbar-group" data-toolbar-group="font-size"><input type="number" min="1" max="512" step="0.5" value="12" data-font-size data-inline-style="font_size_pt" aria-label="Tamanho da fonte (pt)"></div>
<div class="toolbar-group" data-toolbar-group="decoration">
<button class="icon-button" data-command="underline" aria-label="Sublinhado"><u>U</u></button><button class="icon-button" data-command="strike" aria-label="Tachado"><s>S</s></button><button class="icon-button" data-command="superscript" aria-label="Sobrescrito">x²</button><button class="icon-button" data-command="subscript" aria-label="Subscrito">x₂</button>
</div>
<div class="toolbar-group" data-toolbar-group="colors">
<label title="Cor do texto">A <input type="color" value="#202124" data-inline-style="color" aria-label="Cor do texto"></label><label title="Realce">▰ <input type="color" value="#ffff00" data-inline-style="highlight" aria-label="Realce"></label>
</div>
<div class="toolbar-group" data-toolbar-group="alignment"><select data-paragraph-style="alignment" aria-label="Alinhamento"><option value="left">Esquerda</option>
<option value="center">Centro</option>
<option value="right">Direita</option>
<option value="justify">Justificado</option></select></div>
<div class="toolbar-group" data-toolbar-group="spacing"><select data-paragraph-style="line_spacing" aria-label="Entrelinhas"><option value="1">Simples</option>
<option value="1.15">1,15</option>
<option value="1.5">1,5</option>
<option value="2">Duplo</option></select></div>
<div class="toolbar-group" data-toolbar-group="indent"><input type="number" min="0" max="720" step="6" value="0" data-paragraph-style="left_indent_pt" aria-label="Recuo esquerdo (pt)" title="Recuo em pontos"></div>
<div class="toolbar-group" data-toolbar-group="table"><button class="icon-button" data-action="table-insert" aria-label="Inserir tabela" title="Inserir tabela…">▦</button></div>
</div>
