name: Vela Qt cross-platform validation
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [fix/stabilization, fix/input-stability, fix/stylus-handwriting-stability]
    paths-ignore: ["docs/**", "README.md", "THIRD_PARTY_NOTICES.md"]
jobs:
  windows-qt:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYWEBVIEW_GUI: qt
      QT_API: pyqt5
      QT_QPA_PLATFORM: windows
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and collectstatic bootstrap
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item apps/open_doc/static/js/vendor/pdf.bundle.js -ErrorAction SilentlyContinue
          if (Test-Path node_modules) { throw "node_modules must not exist before collectstatic bootstrap" }
          python manage.py collectstatic --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path node_modules)) { throw "collectstatic did not install project-local npm dependencies" }
          node --version
          npm --version
          python tools/check_runtime_assets.py
          exit $LASTEXITCODE
      - name: Unit and architecture regressions
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE
      - name: Actual Vela PyQt QtWebEngine
        shell: pwsh
        run: |
          python -u tools/qa_windows_ink.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tools/qa_input.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tools/qa_stabilization.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tools/qa_ink.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tools/qa_pptx.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tools/qa_desktop.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qt-screenshots
          path: docs/images/stabilization/

  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYWEBVIEW_GUI: qt
      QT_API: pyqt5
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxss1 libopengl0
      - name: Dependencies and collectstatic bootstrap
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          test ! -d node_modules
          python manage.py collectstatic --yes
          test -d node_modules
          python tools/check_runtime_assets.py
      - name: Unit and architecture regressions
        run: |
          python -m pytest -q
          npm test
      - name: Actual Vela PyQt QtWebEngine
        run: |
          python -u tools/qa_windows_ink.py
          python -u tools/qa_input.py
          python -u tools/qa_stabilization.py
          python -u tools/qa_ink.py
          python -u tools/qa_pptx.py
          python -u tools/qa_desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-qt-screenshots
          path: docs/images/stabilization/
