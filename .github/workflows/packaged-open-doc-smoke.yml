name: Packaged Open Doc smoke
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/packaged-open-doc-smoke.yml', 'tests/linux_packaged_smoke.sh']
jobs:
  packaged-ubuntu-x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick libegl1 libgl1 libxkbcommon-x11-0 libnss3 libasound2t64
      - name: Download release DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download v1.0.1 --repo zxlawdx/open-doc --pattern '*Linux-amd64.deb' --dir artifacts
          test "$(find artifacts -name '*Linux-amd64.deb' | wc -l)" -eq 1
          sha256sum artifacts/*Linux-amd64.deb | tee artifacts/package.sha256
      - name: Install and execute packaged Open Doc
        run: |
          set -o pipefail
          sudo apt-get install -y ./artifacts/*Linux-amd64.deb 2>&1 | tee artifacts/install.log
          xvfb-run -a -s '-screen 0 1366x768x24' bash tests/linux_packaged_smoke.sh 2>&1 | tee artifacts/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-open-doc-ubuntu-x11
          path: artifacts/
