name: Linux graphical rendering diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-render-diagnostic.yml'
      - 'tests/linux_render_probe.py'
jobs:
  rendering:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
        display: [x11, wayland]
    container:
      image: ${{ matrix.distro == 'fedora' && 'fedora:latest' || 'ubuntu:24.04' }}
    env:
      PROBE_OUTPUT: artifacts
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--no-sandbox --disable-gpu'
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install graphical runtime
        shell: bash
        run: |
          if [ "${{ matrix.distro }}" = fedora ]; then
            dnf install -y python3 python3-pip python3-PyQt6 python3-PyQt6-webengine weston xorg-x11-server-Xvfb mesa-dri-drivers dbus-daemon procps-ng
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pyqt6 python3-pyqt6.qtwebengine weston xvfb libgl1-mesa-dri dbus-x11 procps
          fi
      - name: Start display and verify actual Qt rendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${{ matrix.display }}" = x11 ]; then
            export DISPLAY=:99
            export QT_QPA_PLATFORM=xcb
            Xvfb :99 -screen 0 1280x800x24 >artifacts/display.log 2>&1 &
          else
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            export WAYLAND_DISPLAY=wayland-test
            export QT_QPA_PLATFORM=wayland
            weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 >artifacts/display.log 2>&1 &
          fi
          sleep 3
          set +e
          timeout 45s python3 tests/linux_render_probe.py >artifacts/probe.log 2>&1
          result=$?
          set -e
          cat artifacts/probe.log
          exit "$result"
      - name: Upload logs and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.distro }}-${{ matrix.display }}
          path: artifacts/
          if-no-files-found: warn
