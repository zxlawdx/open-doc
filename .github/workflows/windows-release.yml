name: Open Doc Windows and Linux packages

on:
  push:
    tags: ["v*"]
    branches: ["release/rebuild-v1.0.1"]
  workflow_dispatch:
    inputs:
      linux_release_tag:
        description: "Tag de uma release existente para adicionar somente o pacote Linux"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "packaging/windows/**"
      - "assets/branding/**"
      - "tools/build_release_icon.py"
      - "tools/smoke_release.mjs"
      - "tools/pptx_compat_fixture.mjs"
      - "tools/build_vendor_js.mjs"
      - "apps/open_doc/static/js/vendor/pptx.bundle.js"
      - "apps/open_doc/document_model/images.py"
      - "apps/open_doc/document_model/serialization.py"
      - "apps/open_doc/document_model/validate.py"
      - "apps/open_doc/static/js/persistence_worker.js"
      - "apps/open_doc/static/js/recovery.js"
      - "tools/stage_release_notices.py"
      - "tools/build_linux_deb.py"
      - "requirements.txt"
      - "config/**"

permissions:
  contents: read

jobs:
  windows-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.linux_release_tag == ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Determine version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "Use uma tag vMAJOR.MINOR.PATCH."
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          "OPEN_DOC_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Prepare assets and build with Vela
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt 'vela-framework[build]'
          python manage.py collectstatic --yes
          python tools/build_release_icon.py
          python manage.py buildapp --gui qt5 --icon build/open-doc.ico
          if (-not (Test-Path 'dist/Open-Doc/Open-Doc.exe')) { throw 'Executável ausente.' }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination 'dist/Open-Doc/'
          python tools/stage_release_notices.py dist/Open-Doc
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $name = "Open-Doc-$env:OPEN_DOC_BUILD_VERSION-Windows-x64-Portable.zip"
          # tar includes .vela-app.json, .vela and the Qt runtime directory.
          tar.exe -a -cf "dist/release/$name" -C dist Open-Doc
      - name: Compile branded installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          & $compiler "/DReleaseVersion=$env:OPEN_DOC_BUILD_VERSION" packaging/windows/open-doc.iss
      - name: Verify portable and installed executables
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QT_OPENGL: software
          QT_QUICK_BACKEND: software
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: |
          $version = $env:OPEN_DOC_BUILD_VERSION
          $portable = Join-Path $env:RUNNER_TEMP 'opendoc-portable'
          Expand-Archive "dist/release/Open-Doc-$version-Windows-x64-Portable.zip" $portable
          node tools/smoke_release.mjs "$portable/Open-Doc/Open-Doc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installed = Join-Path $env:RUNNER_TEMP 'opendoc-installed'
          $setup = "dist/release/Open-Doc-$version-Windows-x64-Setup.exe"
          $install = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Instalação falhou ($($install.ExitCode))." }
          node tools/smoke_release.mjs "$installed/Open-Doc.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstall = Start-Process "$installed/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Desinstalação falhou ($($uninstall.ExitCode))." }
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: open-doc-windows-x64
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - name: Determine Linux source and version
        env:
          BACKFILL_TAG: ${{ inputs.linux_release_tag }}
        run: |
          tag="${BACKFILL_TAG:-}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "Use uma tag vMAJOR.MINOR.PATCH." >&2
              exit 1
            }
            version="${tag#v}"
            if [[ -n "$BACKFILL_TAG" ]]; then
              git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              git checkout --detach "refs/tags/$tag"
            fi
          else
            version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          fi
          echo "OPEN_DOC_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "OPEN_DOC_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils xdg-utils libegl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-xkb1 libxcb-render0 libx11-xcb1 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxss1 libopengl0
      - name: Build and archive Linux package
        run: |
          python -m pip install -r requirements.txt 'vela-framework[build]' 'PyQt5-Qt5==5.15.2' 'PyQtWebEngine-Qt5==5.15.2'
          python manage.py collectstatic --yes
          python tools/build_release_icon.py
          python -c 'from PIL import Image; Image.open("build/open-doc.ico").save("build/open-doc.png")'
          python manage.py buildapp --gui qt5 --icon build/open-doc.png --installer
          cp LICENSE THIRD_PARTY_NOTICES.md dist/Open-Doc/
          GITHUB_SHA="$OPEN_DOC_SOURCE_SHA" python tools/stage_release_notices.py dist/Open-Doc
          mkdir -p dist/release
          name="Open-Doc-$OPEN_DOC_BUILD_VERSION-Linux-x64.tar.gz"
          # Preserve executable bits and the Qt runtime's symbolic links.
          tar -czf "dist/release/$name" -C dist Open-Doc
          (cd dist/release && sha256sum "$name" > "$name.sha256")
      - name: Verify Linux portable and per-user installation
        run: |
          mkdir -p "$RUNNER_TEMP/opendoc-linux"
          tar -xzf dist/release/*.tar.gz -C "$RUNNER_TEMP/opendoc-linux"
          bundle="$RUNNER_TEMP/opendoc-linux/Open-Doc"
          export XDG_DATA_HOME="$RUNNER_TEMP/opendoc-linux-data"
          node tools/smoke_release.mjs "$bundle/Open-Doc"
          "$bundle/Instalar.sh"
          test -f "$XDG_DATA_HOME/applications/Open-Doc.desktop"
          node tools/smoke_release.mjs "$XDG_DATA_HOME/vela-apps/Open-Doc/Open-Doc"
      - name: Build Debian installer and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_linux_deb.py --version "$OPEN_DOC_BUILD_VERSION"
          package="dist/release/Open-Doc-${OPEN_DOC_BUILD_VERSION}-Linux-amd64.deb"
          dpkg-deb --info "$package"
          sudo apt-get install -y "./$package"
          command -v open-doc
          test -x /opt/open-doc/Open-Doc/Open-Doc
          desktop-file-validate /usr/share/applications/open-doc.desktop
          node tools/smoke_release.mjs /opt/open-doc/Open-Doc/Open-Doc
          sudo dpkg --remove open-doc

      - uses: actions/upload-artifact@v4
        with:
          name: open-doc-linux-x64
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  linux-clean-runtime:
    name: Packaged app / ${{ matrix.distro }} / X11
    needs: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distro: ['ubuntu:22.04', 'ubuntu:24.04', 'fedora:latest']
    container:
      image: ${{ matrix.distro }}
    env:
      QT_QPA_PLATFORM: xcb
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: '1'
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--no-sandbox --disable-gpu'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: open-doc-linux-x64
          path: packages
      - name: Install distribution runtime
        shell: bash
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y tar gzip xorg-x11-server-Xvfb libX11 libXext libXrender libXtst libXcomposite libXdamage libXrandr libXScrnSaver libxkbcommon-x11 xcb-util-cursor xcb-util-wm xcb-util-keysyms xcb-util-image xcb-util-renderutil mesa-libEGL mesa-libGL nss alsa-lib fontconfig
          else
            apt-get update
            . /etc/os-release
            audio=libasound2
            if [[ "$VERSION_ID" == 24.04 ]]; then audio=libasound2t64; fi
            DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb libx11-6 libx11-xcb1 libxext6 libxrender1 libxtst6 libxcomposite1 libxdamage1 libxrandr2 libxss1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-xkb1 libxcb-render0 libx11-xcb1 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libegl1 libgl1 libnss3 "$audio" libfontconfig1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the built application in a clean distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts bundle
          tar -xzf packages/*.tar.gz -C bundle
          export DISPLAY=:99
          Xvfb :99 -screen 0 1366x768x24 >artifacts/display.log 2>&1 &
          display_pid=$!
          trap 'kill "$display_pid" 2>/dev/null || true' EXIT
          sleep 2
          node tools/smoke_release.mjs "$PWD/bundle/Open-Doc/Open-Doc" 2>&1 | tee artifacts/app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-runtime-${{ strategy.job-index }}
          path: artifacts/

  publish:
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'release/rebuild-v1.0.1')
    needs: [windows-x64, linux-x64, linux-clean-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: open-doc-windows-x64
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: open-doc-linux-x64
          path: packages
      # All packages and clean-distribution checks pass before replacing v1.0.1.
      - name: Replace v1.0.1 after package validation
        if: github.ref_name == 'release/rebuild-v1.0.1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f packages/Open-Doc-1.0.1-Windows-x64-Setup.exe
          test -f packages/Open-Doc-1.0.1-Linux-x64.tar.gz
          test -f packages/Open-Doc-1.0.1-Linux-amd64.deb
          # Only the explicitly requested tag is replaced, after successful builds.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.0.1") | .id' | while read -r id; do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
          tag_sha=$(gh api --method POST "repos/$GH_REPO/git/tags" -f tag=v1.0.1 -f message="Open Doc v1.0.1: correções de compatibilidade PPTX" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          if gh api "repos/$GH_REPO/git/ref/tags/v1.0.1" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v1.0.1" -f sha="$tag_sha" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v1.0.1 -f sha="$tag_sha"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == release/rebuild-v1.0.1 ]]; then tag=v1.0.1; fi
          gh release create "$tag" packages/* --verify-tag \
            --title "Open Doc $tag" --generate-notes


  publish-linux-backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_release_tag != '' && github.ref_name == github.event.repository.default_branch
    needs: [linux-x64, linux-clean-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: open-doc-linux-x64
          path: packages
      - name: Attach Linux files to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.linux_release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          gh release upload "$RELEASE_TAG" packages/*
