<!-- ============ CONTINUOUS A4-WIDTH DOCUMENT ============ -->
<div class="document-canvas" data-canvas>
  <div class="paper-layout" data-paper-layout>
    <div class="paper" data-surface data-editor-mode="rich">
      <label class="sr-only" for="markdown-source">Código-fonte Markdown</label>
      <textarea id="markdown-source" data-source spellcheck="true" hidden disabled></textarea>
      <article data-rich contenteditable="false" role="textbox" aria-multiline="true"
        aria-label="Conteúdo do documento" spellcheck="true" lang="pt-BR"></article>
      <article class="markdown-preview" data-preview-pane hidden aria-label="Visualização Markdown"></article>
    </div>
  </div>
</div>
