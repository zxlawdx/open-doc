<!-- ============ VELA WORKSPACE VIEW ============ -->
<link rel="stylesheet" href="{{ static('writer/css/main.css') }}">
<div class="writer-shell" data-app data-collapsed="false">
  {{ sidebar }}
  <main class="workspace flex flex-col">
    <header class="topbar flex items-center">
      <span class="breadcrumb">Espaço pessoal <span>/</span> Escrita</span>
      <span class="phase-badge">Vela Writer · Fase 2</span>
    </header>
    {{ editor }}
    <!-- ============ LIBRARY ============ -->
    <section class="library" data-library hidden aria-labelledby="library-title">
      <div class="panel-heading">
        <p class="eyebrow">SEU ACERVO</p><h1 id="library-title">Documentos</h1>
        <p>Suas notas ficam salvas neste computador.</p>
      </div>
      <h2 class="list-heading">Notas editáveis</h2>
      <ul data-documents aria-label="Notas editáveis"></ul>
      <h2 class="list-heading">Arquivos importados</h2>
      <ul data-files aria-label="Arquivos importados"></ul>
    </section>
    <!-- ============ STATUS BAR ============ -->
    <footer class="statusbar flex items-center">
      <span data-status role="status" aria-live="polite">Carregando documento…</span>
      <span data-count>0 palavras</span><span>Local · Autosave 30s</span>
    </footer>
  </main>
</div>
<!-- ============ PAGE LIFECYCLE ============ -->
<script src="{{ static('writer/js/app.js') }}"></script>
