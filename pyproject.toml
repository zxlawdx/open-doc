[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-doc"
version = "1.0.1"
description = "Modular Vela workspace for documents, spreadsheets, presentations, PDFs and data"
requires-python = ">=3.12,<3.14"
license = "MIT"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["apps*", "shared*", "config*", "tools*"]

[tool.setuptools.package-data]
"*" = ["templates/*.html", "static/**/*", "styles/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/regression", "tests/performance"]
